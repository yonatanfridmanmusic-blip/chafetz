<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>חפץ?</title>
<meta name="theme-color" content="#FFF4D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="חפץ?">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Rubik+Doodle+Shadow&family=Playpen+Sans+Hebrew:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FFF4D6;--ink:#2B3A1F;--leaf:#4E9A3E;--leaf2:#93D86A;--card:#FFFBEE;--pink:#FF9AA2}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Playpen Sans Hebrew',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
  body{background:radial-gradient(circle at 20% 15%,#FFFDF5 0 18%,transparent 19%),radial-gradient(circle at 85% 80%,#FFEDBF 0 14%,transparent 15%),var(--bg)}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
  .btn{position:relative;width:min(74vw,320px);aspect-ratio:1;border-radius:50%;border:0;padding:0;cursor:pointer;
    background:radial-gradient(circle at 50% 35%,#fff 0,#FFFBEE 60%,#F6EBC8 100%);
    box-shadow:0 14px 0 #E6CF8E,0 22px 40px rgba(120,90,20,.25),inset 0 -6px 0 rgba(0,0,0,.04);
    transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .btn:active,.btn.down{transform:translateY(10px) scale(.97);box-shadow:0 4px 0 #E6CF8E,0 8px 18px rgba(120,90,20,.25)}
  .btn img{width:68%;margin-top:-6%;pointer-events:none;animation:bob 3s ease-in-out infinite}
  .btn span{font-family:'Rubik Doodle Shadow',system-ui;font-size:clamp(44px,14vw,62px);line-height:1;margin-top:-2%;color:var(--leaf)}
  .btn.wiggle img{animation:wig .5s ease}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
  @keyframes wig{20%{transform:rotate(-12deg) scale(1.08)}50%{transform:rotate(10deg) scale(1.1)}80%{transform:rotate(-4deg)}}
  .fly{position:fixed;width:56px;pointer-events:none;z-index:5;animation:fly 1.1s ease-out forwards}
  @keyframes fly{to{transform:translate(var(--dx),-70vh) rotate(var(--r)) scale(.4);opacity:0}}
  .panel{width:min(100%,360px);background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:0 6px 0 #EFDDA6;text-align:center;font-size:16px;line-height:1.5}
  .panel b{color:var(--leaf)}
  .row{display:flex;gap:8px;margin-top:10px}
  input{font-family:inherit;flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 14px;border-radius:14px;border:2px solid #E9D9A4;background:#fff;color:var(--ink);text-align:center}
  .pill{font:inherit;font-size:16px;border:0;border-radius:14px;padding:10px 16px;background:var(--leaf);color:#fff;box-shadow:0 4px 0 #3E8231;cursor:pointer}
  .pill:active{transform:translateY(3px);box-shadow:0 1px 0 #3E8231}
  .muted{opacity:.65;font-size:14px}
  .hidden{display:none}
  .toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 24px);left:50%;transform:translate(-50%,40px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;transition:.25s;z-index:9}
  .toast.on{transform:translate(-50%,0);opacity:1}
  .approve{width:min(100%,360px);background:#4E9A3E;color:#fff;border-radius:22px;padding:14px 16px;text-align:center;box-shadow:0 6px 0 #3E8231;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
  .approve .who{font-size:17px;margin-bottom:10px}
  .approve button{font-family:'Rubik Doodle Shadow',system-ui;font-size:30px;width:100%;border:0;border-radius:16px;padding:10px;background:#FFF4D6;color:#3E8231;box-shadow:0 5px 0 #E6CF8E;cursor:pointer}
  .approve button:active{transform:translateY(4px);box-shadow:0 1px 0 #E6CF8E}
  @keyframes pop{from{transform:scale(.6);opacity:0}}
  .hurray{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:8;pointer-events:none}
  .hurray div{font-family:'Rubik Doodle Shadow',system-ui;font-size:clamp(56px,20vw,110px);color:#4E9A3E;animation:hurray 2.2s cubic-bezier(.3,1.6,.5,1) forwards}
  @keyframes hurray{0%{transform:scale(.2) rotate(-20deg);opacity:0}15%{transform:scale(1.15) rotate(6deg);opacity:1}30%{transform:scale(1) rotate(-3deg)}80%{opacity:1}100%{transform:scale(1.4);opacity:0}}
</style>
</head>
<body>
<main>
  <button class="btn" id="btn" aria-label="חפץ?">
    <img src="lettuce.svg" alt="">
    <span>חפץ?</span>
  </button>

  <div class="approve hidden" id="approve">
    <div class="who" id="approveWho">מישהו שאל: חפץ?</div>
    <button id="approveBtn">מאשר חפץ ✅</button>
  </div>

  <div class="panel hidden" id="ios">
    כדי לקבל התראות באייפון:<br>
    לוחצים על <b>שיתוף</b> ⬆️ ואז <b>הוסף למסך הבית</b>,<br>ופותחים את האפליקציה משם 🥬
  </div>

  <div class="panel hidden" id="setup">
    <div>איך קוראים לך?</div>
    <div class="row">
      <input id="name" maxlength="20" placeholder="השם שיופיע בהתראה">
      <button class="pill" id="enable">הפעל התראות</button>
    </div>
  </div>

  <div class="muted hidden" id="status"></div>
</main>
<div class="toast" id="toast"></div>

<script>
const API = "https://vndqjbatptgircjgsvdu.supabase.co/functions/v1/chafetz";
const CODE = "FKdfq-eUVam0";
const $ = id => document.getElementById(id);
const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const pushOK = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
let endpoint = null;

function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1800)}
async function api(body){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:CODE,...body})});return r.json()}
function b64(u){const p='='.repeat((4-u.length%4)%4);const s=atob((u+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(s,c=>c.charCodeAt(0))}

async function init(){
  $('name').value = store.get('name') || '';
  if (isIOS && !standalone) { $('ios').classList.remove('hidden'); return; }
  if (!pushOK) { status('הדפדפן הזה לא תומך בהתראות'); return; }
  const reg = await navigator.serviceWorker.register('sw.js');
  const sub = await reg.pushManager.getSubscription();
  if (sub && Notification.permission === 'granted') { endpoint = sub.endpoint; status('התראות פעילות 🥬'); }
  else $('setup').classList.remove('hidden');
}
function status(t){const s=$('status');s.textContent=t;s.classList.remove('hidden')}

$('enable').onclick = async () => {
  const name = $('name').value.trim();
  store.set('name', name);
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('צריך לאשר התראות 🙏'); return; }
    const reg = await navigator.serviceWorker.ready;
    const { key } = await api({ action: 'vapid' });
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(key) });
    const res = await api({ action: 'subscribe', name, subscription: sub.toJSON() });
    if (!res.ok) throw new Error(res.error);
    endpoint = sub.endpoint;
    $('setup').classList.add('hidden');
    status('התראות פעילות 🥬');
    toast('מוכן! עכשיו תלחץ על החסה');
  } catch (e) { toast('משהו נתקע: ' + e.message); }
};

$('btn').onclick = async (ev) => {
  const b = $('btn'); b.classList.remove('wiggle'); void b.offsetWidth; b.classList.add('wiggle');
  if (navigator.vibrate) navigator.vibrate(30);
  for (let i = 0; i < 5; i++) {
    const f = document.createElement('img'); f.src = 'lettuce.svg'; f.className = 'fly';
    f.style.left = (ev.clientX || innerWidth/2) - 28 + 'px'; f.style.top = (ev.clientY || innerHeight/2) - 28 + 'px';
    f.style.setProperty('--dx', (Math.random()*200-100) + 'px'); f.style.setProperty('--r', (Math.random()*720-360) + 'deg');
    f.style.animationDelay = i*60 + 'ms'; document.body.appendChild(f); setTimeout(() => f.remove(), 1500);
  }
  try {
    const res = await api({ action: 'press', endpoint, name: store.get('name') || '' });
    if (res.throttled) return;
    toast(res.sent ? 'חפץ? נשלח 🥬' : 'אין עדיין למי לשלוח 🥲');
  } catch { toast('אין חיבור 🥲'); }
};

let audio = null;
function unlockAudio(){ try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch {} }
document.addEventListener('pointerdown', unlockAudio, { passive: true });

function hurraySound(){
  unlockAudio(); if (!audio) return;
  const t0 = audio.currentTime + .05, out = audio.createGain();
  out.gain.value = .35; out.connect(audio.destination);
  const note = (f, t, d, type='square', v=.5) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0+t);
    g.gain.setValueAtTime(0, t0+t); g.gain.linearRampToValueAtTime(v, t0+t+.01); g.gain.exponentialRampToValueAtTime(.001, t0+t+d);
    o.connect(g); g.connect(out); o.start(t0+t); o.stop(t0+t+d+.05);
  };
  [523,659,784,1047].forEach((f,i)=>note(f, i*.09, .14));
  note(784,.40,.12); note(1047,.52,.5,'square',.55); note(1319,.52,.5,'triangle',.4);
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(330, t0+1.05); o.frequency.exponentialRampToValueAtTime(880, t0+1.45);
  g.gain.setValueAtTime(0, t0+1.05); g.gain.linearRampToValueAtTime(.35, t0+1.1); g.gain.exponentialRampToValueAtTime(.001, t0+1.7);
  o.connect(g); g.connect(out); o.start(t0+1.05); o.stop(t0+1.75);
}

let lastParty = 0;
function celebrate(title){
  if (Date.now() - lastParty < 4000) return; lastParty = Date.now();
  hurraySound();
  if (navigator.vibrate) navigator.vibrate([100,50,100,50,300]);
  const h = document.createElement('div'); h.className = 'hurray'; h.innerHTML = '<div>הורייי!</div>';
  document.body.appendChild(h); setTimeout(() => h.remove(), 2300);
  for (let i = 0; i < 14; i++) {
    const f = document.createElement('img'); f.src = 'lettuce.svg'; f.className = 'fly';
    f.style.left = Math.random()*innerWidth - 28 + 'px'; f.style.top = innerHeight - 40 + 'px';
    f.style.setProperty('--dx', (Math.random()*160-80) + 'px'); f.style.setProperty('--r', (Math.random()*720-360) + 'deg');
    f.style.animationDelay = i*50 + 'ms'; document.body.appendChild(f); setTimeout(() => f.remove(), 2000);
  }
  if (title) toast(title);
}

let approveTo = null;
function showApprove(from, title){
  approveTo = from;
  $('approveWho').textContent = (title ? title.replace(' 🥬','') + ' שואל: ' : 'שאלו אותך: ') + 'חפץ?';
  $('approve').classList.remove('hidden');
}
$('approveBtn').onclick = async () => {
  if (!approveTo) return;
  $('approve').classList.add('hidden');
  try {
    const res = await api({ action: 'approve', to: approveTo, endpoint, name: store.get('name') || '' });
    toast(res.ok ? 'החפץ אושר ✅' : 'לא הצלחתי לשלוח 🥲');
  } catch { toast('אין חיבור 🥲'); }
  approveTo = null;
};

if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'hurray') celebrate(d.title);
  if (d.type === 'chafetz' && d.from) showApprove(d.from, d.title);
});

const qs = new URLSearchParams(location.search);
if (qs.get('approve')) showApprove(qs.get('approve'));
if (qs.get('hurray')) setTimeout(() => celebrate(), 300);
if (location.search) history.replaceState(null, '', location.pathname);

init();
</script>
</body>
</html>
